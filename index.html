<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="referrer" content="no-referrer">
<title>桥 · Ponte</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:"Source Sans 3";font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Sans 3";font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Sans 3";font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Source Sans 3";font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+FEFF,U+FFFD}
@font-face{font-family:"Source Serif 4";font-weight:600;font-display:swap;src:url(fonts/source-serif-4-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02AF,U+1E00-1E9F,U+1EF2-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
:root{
  --de:#7a5aa0;--de-soft:#ece4f5;--en:#2f7f9a;--en-soft:#dcedf3;
  --bg:#f6f3ee;--card:#fff;--sunk:#efebe4;--ink:#1f2a2e;--muted:#69736f;--line:#e2ddd4;
  --acc:#2c6b64;--acc-soft:#e3efec;--zh:#b4492f;--zh-soft:#f7e6df;--pt:#2c6b64;--pt-soft:#e3efec;--warn:#9a5b12;
  --f-ui:"Source Sans 3",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-head:"Source Serif 4","Songti SC","Noto Serif CJK SC",Georgia,serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{--bg:#141a1c;--card:#1c2427;--sunk:#11171a;--ink:#e6ecea;--muted:#9aa6a2;--line:#2c373a;--acc:#6fb8ad;--acc-soft:#203532;--zh:#e48a6f;--zh-soft:#3a2620;--pt:#6fb8ad;--pt-soft:#203532}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px}
.brand h1{font-family:var(--f-head);font-size:21px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:12.5px;color:var(--muted)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{background:#b23b2a;border-color:#b23b2a;color:#fff}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.ghost{border-color:transparent;background:none}
.btn svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}.small{font-size:13px}
input[type=text],input[type=password],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.err{color:#b23b2a;font-size:13.5px;min-height:1.2em;margin-top:8px}
/* gate */
.gate{max-width:460px;margin:7vh auto 0}
.gate h2{font-family:var(--f-head);font-weight:600;font-size:24px;margin:4px 0 6px}
.gate .lead{color:var(--muted);margin:0 0 6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left}
.pick button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.pick b{display:block;font-size:15px}.pick span{font-size:12.5px;color:var(--muted)}
.linkbox{display:flex;gap:8px;margin-top:6px}.linkbox input{font-size:13.5px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
/* room */
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px}
.vid{position:relative;background:#0f1517;border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;display:grid;place-items:center}
.vid video#rv{width:100%;height:100%;object-fit:cover;background:#0f1517}
.vid video#lv{position:absolute;right:12px;bottom:68px;width:26%;max-width:200px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.7);transform:scaleX(-1);background:#222;z-index:2}
.vid video#lv.screen{transform:none}
.vid .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#e6ecea;padding:20px;z-index:1}
.vid .idle .who{font-size:14px;color:#aab6b2;margin-top:6px}
.vid .bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:3}
.cb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.cb:hover{background:rgba(255,255,255,.26)}.cb svg{width:22px;height:22px}
.cb.off{background:#fff;color:#1f2a2e}.cb.end{background:#c0392b}
.vid .st{position:absolute;left:12px;top:12px;font-size:12.5px;color:#fff;background:rgba(0,0,0,.45);padding:3px 10px;border-radius:999px;z-index:3}
.vid .rname{position:absolute;left:12px;bottom:70px;font-size:13px;color:#fff;background:rgba(0,0,0,.45);padding:2px 9px;border-radius:999px;z-index:3}
.people{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.people span{background:var(--sunk);border-radius:999px;padding:3px 10px}
.people span.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3c9a5f;margin-right:6px;vertical-align:1px}
/* timer */
.tm{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tm h3{margin:0;font-size:17px}
.tm .big{font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;letter-spacing:.02em}
.phase{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.phase.zh{background:var(--zh-soft);color:var(--zh)}.phase.pt{background:var(--pt-soft);color:var(--pt)}.phase.de{background:var(--de-soft);color:var(--de)}.phase.en{background:var(--en-soft);color:var(--en)}
.track{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);margin:12px 0 6px}
.track i{display:block;height:100%}
.track i.zh{background:var(--zh)}.track i.pt{background:var(--pt)}.track i.de{background:var(--de)}.track i.en{background:var(--en)}
.track i.left{opacity:.25}
.legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.plan{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13.5px}
.plan select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 6px}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 12px;padding:0 4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabs .n{font-size:11.5px;background:var(--sunk);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
.add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.add.fx{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.add.fx .wide{grid-column:1/-1;display:flex;gap:8px}
@media (max-width:520px){.add{grid-template-columns:minmax(0,1fr)}}
.ltag{display:flex;gap:6px;margin:8px 0 2px;font-size:13px;align-items:center;flex-wrap:wrap}
.ltag button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:12.5px}
.ltag button[aria-pressed="true"].zh{background:var(--zh-soft);border-color:var(--zh);color:var(--zh)}
.ltag button[aria-pressed="true"].pt{background:var(--pt-soft);border-color:var(--pt);color:var(--pt)}
.ltag button[aria-pressed="true"].de{background:var(--de-soft);border-color:var(--de);color:var(--de)}
.ltag button[aria-pressed="true"].en{background:var(--en-soft);border-color:var(--en);color:var(--en)}
.ltag button.de,.ltag button.en{border-color:var(--line)}
ul.items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
ul.items li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
ul.items .dot{width:8px;height:8px;border-radius:50%;margin-top:8px}
ul.items .dot.zh{background:var(--zh)}ul.items .dot.pt{background:var(--pt)}ul.items .dot.de{background:var(--de)}ul.items .dot.en{background:var(--en)}
ul.items .w{font-weight:600;font-size:16px}
ul.items .m{color:var(--ink)}
ul.items .by{font-size:12px;color:var(--muted)}
ul.items .bad{text-decoration:line-through;color:var(--muted)}
ul.items .good{font-weight:600}
ul.items .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px}
.empty{color:var(--muted);font-size:14px;padding:14px 4px}
.sumgrid{display:grid;gap:12px}
.sumgrid h4{margin:0 0 4px;font-size:14px}
.ro{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:60px}
.saved{font-size:12px;color:var(--muted)}
/* lesson text */
.xtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.lesson{white-space:pre-wrap;font-size:17.5px;line-height:1.85;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:160px;max-height:62vh;overflow:auto;-webkit-user-select:text;user-select:text}
.lesson:empty::before{content:attr(data-empty);color:var(--muted);font-size:15px}
.lesson mark{background:#fbe8a6;color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.lesson mark.g{background:#cfe9dc}.lesson mark.c{border-bottom:2px solid var(--zh)}
.lesson mark.on{outline:2px solid var(--acc)}
@media (prefers-color-scheme:dark){.lesson mark{background:#5a4a14}.lesson mark.g{background:#1f4a39}}
#x-edit{font-size:16.5px;line-height:1.75;min-height:260px}
.selbar{position:sticky;bottom:8px;margin-top:10px;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px;display:grid;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:5}
.selbar .q{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selbar .r{display:flex;gap:6px;flex-wrap:wrap}
.typing{font-size:12.5px;color:var(--acc)}
body.wide .grid{grid-template-columns:minmax(0,.78fr) minmax(0,1.5fr)}
@media (max-width:900px){body.wide .grid{grid-template-columns:minmax(0,1fr)}}
ul.items li.on{border-color:var(--acc)}
/* speaking time */
.talk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.talk h4{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.trow{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.trow .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.trow .nm i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.trow .nm i.sp{background:#3c9a5f;box-shadow:0 0 0 4px rgba(60,154,95,.18)}
.tbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.tbar b{display:block;height:100%}.tbar b.zh{background:var(--zh)}.tbar b.pt{background:var(--pt)}.tbar b.de{background:var(--de)}.tbar b.en{background:var(--en)}.tbar b.free{background:var(--muted);opacity:.45}
.trow .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.share{font-size:13px;color:var(--muted)}.share b{color:var(--ink)}
.trend{display:grid;gap:5px;margin:0 0 14px}
.trend .r{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 3.6rem;gap:8px;align-items:center;font-size:12.5px}
.trend .r .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* whiteboard */
#bd{width:100%;aspect-ratio:4/3;display:block;border-radius:12px;border:1px solid var(--line);touch-action:none;cursor:crosshair;background:#fdfdfb}
#b-cols button{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
#b-cols button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--acc)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,17,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:var(--r);max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 10px;font-family:var(--f-head);font-weight:600;font-size:19px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist button{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px}
.hist button[aria-current="true"]{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw}
.sessbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sessbar .t{font-weight:600}
.gatebox{margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.1)}
.gatebox h4{margin:0 0 4px;font-size:15px}
.grow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.grow select{width:auto;padding:6px 10px}
.gname{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:.02em}
.gnums{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gnums button{font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;padding:10px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:#fff;cursor:pointer}
.gnums button:hover{border-color:currentColor}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.qrbox{display:flex;gap:14px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
#i-qr{background:#fff;padding:8px;border-radius:10px;border:1px solid rgba(0,0,0,.12);line-height:0}
#i-qr svg{width:168px;height:168px;display:block}
.qrside{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""><div style="min-width:0"><h1 id="title">桥 · Ponte</h1><div class="sub" data-i="tagline"></div></div></div>
    <div class="sp"></div>
    <div class="seg" id="uil" role="group" aria-label="Language"><button data-ui="zh">中文</button><button data-ui="pt">PT</button><button data-ui="en">EN</button></div>
    <button class="btn sm primary" id="b-inv" hidden><span data-i="invite"></span></button>
    <button class="btn sm" id="b-hist" hidden><span data-i="history"></span></button>
    <button class="btn sm ghost" id="b-leave" hidden><span data-i="leave"></span></button>
  </header>

  <!-- create -->
  <section class="gate card" id="v-create" hidden>
    <h2 data-i="createTitle"></h2>
    <p class="lead" data-i="createLead"></p>
    <label class="f" for="c-name" data-i="spaceName"></label>
    <input type="text" id="c-name" maxlength="60" autocomplete="off">
    <label class="f" for="c-me" data-i="yourName"></label>
    <input type="text" id="c-me" maxlength="40" autocomplete="nickname">
    <label class="f" data-i="iLearn"></label>
    <div class="pick" data-pick="c"><button data-l="zh" aria-pressed="false"><b>中文</b><span data-i="learnZh"></span></button><button data-l="pt" aria-pressed="false"><b>Português</b><span data-i="learnPt"></span></button><button data-l="de" aria-pressed="false"><b>Deutsch</b><span data-i="learnDe"></span></button><button data-l="en" aria-pressed="false"><b>English</b><span data-i="learnEn"></span></button></div>
    <div style="margin-top:16px"><button class="btn primary" id="c-go"><span data-i="create"></span></button></div>
    <div class="err" id="c-err"></div>
    <p class="small" style="margin-top:14px"><button class="linkbtn" id="c-enter"><span data-i="haveGate"></span></button></p>
  </section>

  <!-- enter with a room name + number -->
  <section class="gate card" id="v-enter" hidden>
    <h2 data-i="enterTitle"></h2>
    <p class="lead" data-i="enterLead"></p>
    <label class="f" for="e-gname" data-i="gateName"></label>
    <input type="text" id="e-gname" maxlength="60" autocomplete="off" data-ph="gateNamePh">
    <label class="f" for="e-num" data-i="gateNum"></label>
    <input type="text" id="e-num" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="2255">
    <label class="f" for="e-name" data-i="yourName"></label>
    <input type="text" id="e-name" maxlength="40" autocomplete="nickname">
    <label class="f" data-i="iLearn"></label>
    <div class="pick" data-pick="e"><button data-l="zh" aria-pressed="false"><b>中文</b><span data-i="learnZh"></span></button><button data-l="pt" aria-pressed="false"><b>Português</b><span data-i="learnPt"></span></button><button data-l="de" aria-pressed="false"><b>Deutsch</b><span data-i="learnDe"></span></button><button data-l="en" aria-pressed="false"><b>English</b><span data-i="learnEn"></span></button></div>
    <div style="margin-top:16px"><button class="btn primary" id="e-go"><span data-i="enterGo"></span></button></div>
    <div class="err" id="e-err"></div>
  </section>

  <!-- accept a one-time invite -->
  <section class="gate card" id="v-join" hidden>

/* ---------- crypto: password → room id + AES key (PBKDF2, AES-GCM) ---------- */
const te=new TextEncoder(), td=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...new Uint8Array(u)].map(b=>b.toString(16).padStart(2,"0")).join("");
const b64u=u=>b64(u).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""), unb64u=s=>unb64(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
async function sha(u8,suffix){ const a=new Uint8Array(u8.length+suffix.length); a.set(u8); a.set(te.encode(suffix),u8.length); return new Uint8Array(await crypto.subtle.digest("SHA-256",a)); }
async function inviteKeys(secret){ const id=hex(await sha(secret,"|inv")); const key=await crypto.subtle.importKey("raw",await sha(secret,"|wrap"),"AES-GCM",false,["encrypt","decrypt"]); return {id,key}; }
async function keysFrom(bits){
  const cat=(s)=>{ const a=new Uint8Array(bits.length+s.length); a.set(bits); a.set(te.encode(s),bits.length); return a; };
  const id=hex(await crypto.subtle.digest("SHA-256",cat("|id")));
  const kraw=await crypto.subtle.digest("SHA-256",cat("|key"));
  const key=await crypto.subtle.importKey("raw",kraw,"AES-GCM",false,["encrypt","decrypt"]);
  return {id,key};
}
async function enc(obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},K.key,te.encode(JSON.stringify(obj))); return b64(iv)+"."+b64(ct); }
async function dec(s){ const [a,b]=String(s).split("."); const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(a)},K.key,unb64(b)); return JSON.parse(td.decode(pt)); }

const Store={
  async get(id){ if(LOCAL){ const v=localStorage.getItem("ponte-db-"+id); return v?JSON.parse(v):null; }
    const {data,error}=await sb().rpc("tandem_get",{p_id:id}); if(error) throw error; return data&&data[0]||null; },
  async put(id,data,rev){ if(LOCAL){ const cur=await this.get(id); if((cur?cur.rev:0)!==rev) return -1; const n=rev+1; localStorage.setItem("ponte-db-"+id,JSON.stringify({data,rev:n})); return n; }
    const {data:r,error}=await sb().rpc("tandem_put",{p_id:id,p_data:data,p_rev:rev}); if(error) throw error; return r; },

  async inviteRedeem(id){ if(LOCAL){ const v=localStorage.getItem("ponte-inv-"+id); localStorage.removeItem("ponte-inv-"+id); return v; }

let BUS=null;
function busOpen(name,onMsg){
  if(LOCAL){ const ch=new BroadcastChannel("ponte-"+name); ch.onmessage=e=>onMsg(e.data); return {send:m=>ch.postMessage(m),close:()=>ch.close()}; }
  const ch=sb().channel("ponte:"+name,{config:{broadcast:{self:false}}});
  ch.on("broadcast",{event:"m"},p=>onMsg(p.payload));
  let ready=false; const q=[];
  ch.subscribe(st=>{ if(st==="SUBSCRIBED"){ ready=true; q.splice(0).forEach(m=>ch.send({type:"broadcast",event:"m",payload:m})); presence(true); } });
  return {send:m=>{ if(ready) ch.send({type:"broadcast",event:"m",payload:m}); else q.push(m); },close:()=>sb().removeChannel(ch)};

/* save: read → merge → write with revision check, debounced */
let saveT=null, saving=false, dirty=false;
function saveSoon(){ dirty=true; $("#n-saved").textContent=t("saving"); clearTimeout(saveT); saveT=setTimeout(saveNow,1200); }
async function saveNow(){
  if(saving){ saveSoon(); return; } saving=true; dirty=false;
  try{
    for(let i=0;i<4;i++){
      const r=await Store.put(K.id,await enc(R),REV);
      if(r>0){ REV=r; break; }
      const cur=await Store.get(K.id); if(cur){ mergeRoomLive(await dec(cur.data)); REV=cur.rev; }
    }
    $("#n-saved").textContent=t("savedAt")+" · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }catch(e){ console.warn(e); $("#n-saved").textContent=t("saveFail"); setTimeout(saveSoon,8000); }
  finally{ saving=false; }
}

/* ---------- room name + number ("红色跑鞋 · 2255") ----------
   The name is canonicalised (case, accents, spaces; the 128 dice words also match across 中文/拼音/PT/DE/EN and 繁體),

const nrm=s=>String(s||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/\p{M}/gu,"").replace(/[^\p{L}\p{N}]/gu,"");
const WN=new Map(); WORDS.forEach((r,i)=>r.flat().forEach(v=>WN.set(nrm(v),i))); const WMAX=Math.max(...[...WN.keys()].map(k=>k.length));
function segs(name){ const x=nrm(name), out=[]; let i=0; while(i<x.length){ let L=Math.min(WMAX,x.length-i), hit=-1; for(;L>0;L--){ const k=x.slice(i,i+L); if(WN.has(k)){ hit=WN.get(k); break; } } if(hit>=0){ out.push(hit); i+=L; } else { out.push(x[i]); i++; } } return out; }
const canon=name=>segs(name).map(v=>typeof v==="number"?"#"+v+";":v).join("");
function wordsOf(name){ const sg=segs(name); return sg.length&&sg.every(v=>typeof v==="number")?sg:null; }
function describeName(name){ const w=wordsOf(name); if(!w) return ""; const li={zh:0,pt:2,de:3,en:4}; return ["zh","pt","de","en"].map(l=>w.map(i=>WORDS[i][li[l]][0]).join(l==="zh"?"":" ")).join(" · "); }
function diceName(){ const a=Math.floor(Math.random()*WORDS.length); let b; do{ b=Math.floor(Math.random()*WORDS.length); }while(b===a);
  const col={zh:0,pt:2,en:4}[UIL]??0; return [a,b].map(i=>WORDS[i][col][0]).join(col===0?"":" "); }
async function gateKeys(name){
  const base=await crypto.subtle.importKey("raw",te.encode(canon(name)),"PBKDF2",false,["deriveBits"]);
  const seed=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode("ponte-gate-v1"),iterations:150000},base,256));
  return {seed,id:hex(await sha(seed,"|gate"))};
}
async function codeKeys(seed,num){ const c=await sha(seed,"|code|"+num);
  return {id:hex(await sha(c,"|id")),key:await crypto.subtle.importKey("raw",await sha(c,"|wrap"),"AES-GCM",false,["encrypt","decrypt"])}; }

async function handleMsg(m){
  if(!m||m.f===ME.id) return; let b; try{ b=await dec(m.e); }catch(e){ return; }
  const from=m.f;
  if(b.type==="here"){ const was=PEERS.get(from); PEERS.set(from,{name:b.name,learn:b.learn,call:b.call,seen:now()}); if(b.ask) presence(false);
    if(!was){ renderPeople(); send("sync",{room:liteRoom()}); } else renderPeople();
    if(b.call&&LOCALSTREAM&&!PC) startPC(from); callUI(); return; }
  if(b.type==="bye"){ PEERS.delete(from); if(PEER===from) closePC(); renderPeople(); callUI(); return; }
  const p=PEERS.get(from); if(p) p.seen=now();
  if(b.type==="sync"){ mergeRoomLive(b.room); renderAll(); return; }
  if(b.type==="y"){ if(R.sessions[b.sid]) applyY(b.sid,unb64(b.u)); return; }
  if(b.type==="typing"){ showTyping(b.where,(p&&p.name)||""); return; }
  if(b.type==="chg"){ const before=R.cur.v; if(b.kind==="session"&&b.data&&b.data.y) { /* merged in applyChange */ } applyChange(b.kind,b.data); if(b.kind==="cur"&&R.cur.v!==before) toast(t("newStarted",(p&&p.name)||"…")); renderAll(true); return; }
  if(b.type==="spk"){ PEERSPK.set(from,!!b.v); return; }
  if(b.type==="hang"){ if(PEER===from) closePC(); return; }
  if(b.type==="sig") return onSignal(from,b);
}

}

async function startCall(){
  try{ LOCALSTREAM=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"}}); }
  catch(e){ try{ LOCALSTREAM=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); toast(t("noCam")); }catch(e2){ toast(t("noCam")); return; } }
  const lv=$("#lv"); lv.srcObject=LOCALSTREAM; lv.hidden=false; startVAD(LOCALSTREAM);
  presence(); for(const [id,p] of PEERS) if(p.call){ startPC(id); break; }
  callUI();

function startPC(peer){
  if(PC) closePC(); PEER=peer; const polite=ME.id<peer;
  const pc=PC=new RTCPeerConnection({iceServers:iceServers()});
  LOCALSTREAM.getTracks().forEach(tr=>{ const s=pc.addTrack(tr,LOCALSTREAM); if(tr.kind==="video") camSender=s; });
  pc.ontrack=e=>{ const rv=$("#rv"); if(rv.srcObject!==e.streams[0]){ rv.srcObject=e.streams[0]; } callUI(); };
  pc.onicecandidate=e=>{ if(e.candidate) send("sig",{to:peer,cand:e.candidate.toJSON()}); };
  pc.onnegotiationneeded=async()=>{ try{ makingOffer=true; await pc.setLocalDescription(); send("sig",{to:peer,desc:pc.localDescription.toJSON()}); }catch(e){ console.warn(e); } finally{ makingOffer=false; } };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==="failed") pc.restartIce(); callUI(); };
  pc.oniceconnectionstatechange=()=>callUI();
  pc._polite=polite; callUI();
}
async function onSignal(from,b){
  if(b.to!==ME.id) return;
  if(!LOCALSTREAM) return; if(!PC||PEER!==from) startPC(from);
  const pc=PC;
  try{
    if(b.desc){ const offerCollision=b.desc.type==="offer"&&(makingOffer||pc.signalingState!=="stable");
      ignoreOffer=!pc._polite&&offerCollision; if(ignoreOffer) return;
      await pc.setRemoteDescription(b.desc);
      for(const c of (pc._candQ||[]).splice(0)){ try{ await pc.addIceCandidate(c); }catch(e){} }
      if(b.desc.type==="offer"){ await pc.setLocalDescription(); send("sig",{to:from,desc:pc.localDescription.toJSON()}); } }
    else if(b.cand){ if(!pc.remoteDescription){ (pc._candQ||(pc._candQ=[])).push(b.cand); return; } try{ await pc.addIceCandidate(b.cand); }catch(e){ if(!ignoreOffer) console.warn(e); } }
  }catch(e){ console.warn(e); }
}

/* ---------- timer: two halves, one per language ---------- */
let lastPhase=null;
function phases(){ const p=S().plan, ls=(p.langs&&p.langs.length>=2)?p.langs:["zh","pt"]; return ls.map(l=>({l,m:p.min})); }

function elapsed(){ const tm=S().timer; return tm.run?(tm.acc+(now()-tm.at)):tm.acc; }
function tick(){
  if(!R) return; const ph=phases(), mins=ph.map(x=>x.m*60000), tot=mins.reduce((a,b)=>a+b,0), el=Math.min(elapsed(),tot);
  let idx=0, start=0; while(idx<ph.length-1&&el>=start+mins[idx]){ start+=mins[idx]; idx++; }
  const endOf=start+mins[idx], rest=Math.max(0,endOf-el), over=el>=tot;
  const mm=Math.floor(rest/60000), ss=Math.floor(rest%60000/1000);
  $("#t-big").textContent=over?"00:00":String(mm).padStart(2,"0")+":"+String(ss).padStart(2,"0");
  const cur=ph[idx].l; const pe=$("#t-phase"); pe.className="phase "+(over?"":cur); pe.textContent=over?t("done"):t("now")+" "+LNAME[cur];
  $("#t-track").innerHTML=ph.map((x,i)=>{ const s0=mins.slice(0,i).reduce((a,b)=>a+b,0), done=Math.max(0,Math.min(el-s0,mins[i])), w=mins[i]/tot*100, dw=done/tot*100; return `<i class="${x.l}" style="width:${dw}%"></i><i class="${x.l} left" style="width:${w-dw}%"></i>`; }).join("");
  $("#t-leg").innerHTML=ph.map(x=>`<span>${LNAME[x.l]} · ${x.m} min</span>`).join("");
  const tm=S().timer; $("#t-start").textContent=tm.run?t("pause"):(tm.acc>0&&!over?t("resume"):t("start"));
  const key=S().id+":"+(over?"end":idx);
  if(tm.run&&lastPhase&&lastPhase!==key&&lastPhase.startsWith(S().id)){ chime(over?3:2); toast(over?t("done"):t("switchTo",LNAME[cur])); }
  lastPhase=key; renderTalk();
  if(over&&tm.run) change("timer",{sid:S().id,item:{run:false,at:0,acc:tot,t:now()}});
}

function chime(n){ try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=i%2?660:880; o.connect(g); g.connect(ac.destination); const s=ac.currentTime+i*0.35; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.25,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.3); o.start(s); o.stop(s+0.32); } }catch(e){} }
$("#t-start").addEventListener("click",()=>{ const tm=S().timer, tot=phases().reduce((a,x)=>a+x.m*60000,0);
  let item; if(tm.run) item={run:false,at:0,acc:elapsed(),t:now()}; else item={run:true,at:now(),acc:tm.acc>=tot?0:tm.acc,t:now()};
  change("timer",{sid:S().id,item}); });

/* ---------- shared texts: lesson + notes, edited by both at the same time (Yjs CRDT) ---------- */
const YD=new Map(); // session id → {doc,text,notes,marks}
function yOf(sid){
  if(YD.has(sid)) return YD.get(sid);
  const doc=new Y.Doc(), o={doc,text:doc.getText("text"),notes:doc.getText("notes"),marks:doc.getMap("marks"),board:doc.getArray("board")}; YD.set(sid,o);
  const s=R.sessions[sid];
  if(s&&s.y){ try{ Y.applyUpdate(doc,unb64(s.y),"load"); }catch(e){ console.warn(e); } }
  else if(s&&s.notes&&s.notes.text) doc.transact(()=>o.notes.insert(0,s.notes.text),"load");
  doc.on("update",(u,origin)=>{ const ss=R.sessions[sid]; if(!ss) return; ss.y=b64(Y.encodeStateAsUpdate(doc));
    if(origin==="local"){ send("y",{sid,u:b64(u)}); saveSoon(); } else if(origin==="remote"){ saveSoon(); } });
  return o;
}
let ROUND=0;
function applyY(sid,u){ const o=yOf(sid), sel=capSel(o); Y.applyUpdate(o.doc,u,"remote"); if(sid===R.cur.v){ renderY(sel); } }
// keep the cursor where it was when the partner's change arrives
const TA=()=>[[$("#x-edit"),"text"],[$("#n-text"),"notes"]];
function capSel(o){ const out=[]; for(const [ta,k] of TA()){ if(document.activeElement===ta&&R.cur.v&&yOf(R.cur.v)===o) out.push([ta,Y.createRelativePositionFromTypeIndex(o[k],ta.selectionStart),Y.createRelativePositionFromTypeIndex(o[k],ta.selectionEnd)]); } return out; }
let composing=false, pendingRender=false;
function renderY(sel){
  if(!R) return; const o=yOf(R.cur.v); if(TAB==="board") requestAnimationFrame(drawBoard);
  if(composing){ pendingRender=true; return; }
  for(const [ta,k] of TA()){ const v=o[k].toString(); if(ta.value!==v) ta.value=v; }
  (sel||[]).forEach(([ta,a,b])=>{ const A=Y.createAbsolutePositionFromRelativePosition(a,o.doc), B=Y.createAbsolutePositionFromRelativePosition(b,o.doc); if(A&&B) try{ ta.setSelectionRange(A.index,B.index); }catch(e){} });
  renderLesson(o);

function bindTA(ta,key){
  const push=()=>{ const yt=yOf(R.cur.v)[key], ov=yt.toString(), nv=ta.value; if(ov===nv) return;
    let a=0; while(a<ov.length&&a<nv.length&&ov[a]===nv[a]) a++;
    let b=0; while(b<ov.length-a&&b<nv.length-a&&ov[ov.length-1-b]===nv[nv.length-1-b]) b++;
    yt.doc.transact(()=>{ if(ov.length-a-b>0) yt.delete(a,ov.length-a-b); if(nv.length-a-b>0) yt.insert(a,nv.slice(a,nv.length-b)); },"local");
    typingPing(key); };
  ta.addEventListener("input",e=>{ if(e.isComposing||composing) return; push(); });
  ta.addEventListener("compositionstart",()=>{ composing=true; });
  ta.addEventListener("compositionend",()=>{ composing=false; push(); if(pendingRender){ pendingRender=false; renderY(); } });
}

      if(!on.length){ h+=seg; continue; } const top=on[on.length-1]; h+=`<mark class="${top.m.c||""}${top.m.note?" c":""}${MSEL===top.id?" on":""}" data-mk="${top.id}" title="${esc(top.m.note||"")}">${seg}</mark>`; }
    el.innerHTML=h; }
  $("#l-marks").innerHTML=ms.length?ms.map(r=>`<li class="${MSEL===r.id?"on":""}" data-mli="${r.id}"><span class="dot ${guessL(txt.slice(r.a,r.b))||curLang()}"></span><div><div class="w">${esc(txt.slice(r.a,r.b))}</div>${r.m.note?`<div class="m">${esc(r.m.note)}</div>`:""}<div class="by">${esc(t("by",r.m.by||""))}</div></div><button class="x" data-mdel="${r.id}" aria-label="delete">×</button></li>`).join(""):(txt?`<li class="empty" style="border:0;background:none;display:block">${esc(t("noMarks"))}</li>`:"");
}
function selOffsets(){ const sel=window.getSelection(), root=$("#x-read"); if(!sel||sel.rangeCount===0||sel.isCollapsed) return null; const r=sel.getRangeAt(0);
  if(!root.contains(r.startContainer)||!root.contains(r.endContainer)) return null;
  const pre=document.createRange(); pre.selectNodeContents(root); pre.setEnd(r.startContainer,r.startOffset); const a=pre.toString().length; const b=a+r.toString().length;
  return b>a?{a,b}:null; }
document.addEventListener("selectionchange",()=>{ if(!R||XMODE!=="read") return; const o=selOffsets(); if(o){ SELR=o; const txt=yOf(R.cur.v).text.toString(); $("#sel-q").textContent="“"+txt.slice(o.a,o.b)+"”"; $("#selbar").hidden=false; } });
function addMark(c){ if(!SELR) return; const o=yOf(R.cur.v), id=uid(), note=$("#sel-note").value.trim();
  const rel=i=>b64(Y.encodeRelativePosition(Y.createRelativePositionFromTypeIndex(o.text,i)));
  o.doc.transact(()=>o.marks.set(id,{s:rel(SELR.a),e:rel(SELR.b),c,note,by:ME.name,t:now()}),"local"); return o.text.toString().slice(SELR.a,SELR.b); }
function closeSel(){ SELR=null; $("#sel-note").value=""; $("#selbar").hidden=true; try{ window.getSelection().removeAllRanges(); }catch(e){} }
$("#sel-mark").addEventListener("click",()=>{ addMark(""); closeSel(); renderLesson(yOf(R.cur.v)); });
$("#sel-vocab").addEventListener("click",()=>{ const w=addMark("g"); const note=$("#sel-note").value.trim(); closeSel(); if(w) change("vocab",{sid:S().id,item:{id:uid(),w:w.trim(),m:note,l:guessL(w)||curLang(),by:ME.name,c:now(),t:now()}}); toast(t("toVocab")+" ✓"); });
$("#sel-x").addEventListener("click",closeSel);

  const del=e.target.closest("[data-mdel]"); if(del){ const o=yOf(R.cur.v), id=del.dataset.mdel; o.doc.transact(()=>o.marks.delete(id),"local"); renderLesson(o); } });
function liteRoom(){ const c=R.cur.v; return {v:1,name:R.name,turn:R.turn,cur:R.cur,sessions:{[c]:R.sessions[c]}}; }

/* Word / PDF via PrintKit */
function exportPK(kind){
  const s=S(), o=yOf(s.id), txt=o.text.toString(), ms=markRanges(o), d=new Date(s.created).toISOString().slice(0,10), name=R.name.v||"桥 · Ponte";
  const P=x=>String(x||"").split(/\n/).filter(l=>l.trim()).map(l=>[l]);
  const blocks=[];
  if(ms.length) blocks.push({label:t("marks"),early:true,paras:ms.map(r=>["“"+txt.slice(r.a,r.b)+"”"+(r.m.note?" — "+r.m.note:"")+"  ("+(r.m.by||"")+")"])});
  const F=sorted(s.fix).reverse(); if(F.length) blocks.push({label:t("fixes"),paras:F.map(x=>[(x.bad?x.bad+" → ":"")+x.good+(x.note?"  ("+x.note+")":"")])});
  const nt=o.notes.toString(); if(nt.trim()) blocks.push({label:t("notes"),paras:P(nt)});
  const sums=Object.values(s.sum).filter(x=>x.text&&x.text.trim()); if(sums.length) blocks.push({label:t("summary"),paras:sums.flatMap(x=>[[x.name+":"],...P(x.text)])});
  const TT=Object.values(talkOf(s)); if(TT.length) blocks.push({label:t("talkTitle"),paras:TT.map(x=>[x.name+": "+mmss(LANGK.reduce((a,k)=>a+(x[k]||0),0))+"  ("+LANGK.filter(k=>x[k]).map(k=>(LNAME[k]||t("other"))+" "+mmss(x[k])).join(" · ")+")"])});
  const doc={title:name+" · "+t("sessionN",s.n),meta:d,lang:"zh-CN",paras:P(txt),
    gloss:{label:t("vocab"),rows:sorted(s.vocab).reverse().map(x=>({w:x.w,m:[x.m||""]}))},blocks};
  const opt={title:`${name} ${d}`,filename:`Ponte ${d} ${t("sessionN",s.n)}`,ea:"zh",brand:{name:"桥 · Ponte",url:location.host+location.pathname,accent:"#2c6b64",docFont:"Georgia"}};
  if(kind==="docx") PrintKit.docx([doc],opt); else PrintKit.print([doc],opt);
}


/* ---------- speaking time: each device listens only to its own microphone ---------- */
let VAD=null, SPK=false; const PEERSPK=new Map(); const LIVE={sid:null,zh:0,pt:0,de:0,en:0,free:0}; let talkSaveT=0;
function talkBase(sid){ const it=(R.sessions[sid].talk||{})[ME.name]; const o={}; LANGK.forEach(k=>o[k]=it?(it[k]||0):0); return o; }

function talkBucket(){ const tm=S().timer; return (tm.run||tm.acc>0)?curLang():"free"; }
function startVAD(stream){
  stopVAD(); const tr=stream.getAudioTracks()[0]; if(!tr) return;
  let ac; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const src=ac.createMediaStreamSource(new MediaStream([tr])), an=ac.createAnalyser(); an.fftSize=1024; src.connect(an);
  const buf=new Float32Array(an.fftSize); let floor=0.004, last=now(), hang=0;
  const iv=setInterval(()=>{ const dt=Math.min(500,now()-last); last=now(); if(ac.state==="suspended") ac.resume().catch(()=>{});
    if(!tr.enabled||tr.readyState!=="live"){ setSpk(false); return; }
    an.getFloatTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i]*buf[i]; const rms=Math.sqrt(sum/buf.length);
    floor=rms<floor?floor*0.8+rms*0.2:floor*0.998+rms*0.002; // slow-rising noise floor
    if(rms>Math.max(0.012,floor*3)) hang=400; else hang-=dt;
    const sp=hang>0; if(sp) addTalk(dt); setSpk(sp); },100);
  VAD={ac,iv};
}
function stopVAD(){ if(!VAD) return; clearInterval(VAD.iv); try{ VAD.ac.close(); }catch(e){} VAD=null; setSpk(false); commitTalk(); }
function addTalk(dt){ const sid=R.cur.v; if(LIVE.sid!==sid){ commitTalk(); Object.assign(LIVE,{sid},talkBase(sid)); } LIVE[talkBucket()]+=dt; if(now()-talkSaveT>5000) commitTalk(); }
function commitTalk(){ if(!LIVE.sid||!R||!R.sessions[LIVE.sid]) return; talkSaveT=now();
  const b=talkBase(LIVE.sid); if(LANGK.every(k=>b[k]===LIVE[k])) return;
  change("talk",{sid:LIVE.sid,key:ME.name,item:Object.assign({name:ME.name,learn:ME.learn,t:now()},Object.fromEntries(LANGK.map(k=>[k,Math.round(LIVE[k])])))}); }
function setSpk(v){ if(v===SPK) return; SPK=v; send("spk",{v}); }
const mmss=ms=>{ const s=Math.round(ms/1000), m=Math.floor(s/60); return m>=60?Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0"):m+":"+String(s%60).padStart(2,"0"); };
function talkOf(s){ const out={}; Object.values(s.talk||{}).forEach(x=>{ out[x.name]=Object.assign({name:x.name,learn:x.learn},Object.fromEntries(LANGK.map(k=>[k,x[k]||0]))); });
  if(LIVE.sid===s.id) out[ME.name]=Object.assign({name:ME.name,learn:ME.learn},Object.fromEntries(LANGK.map(k=>[k,LIVE[k]]))); return out; }

function renderTalk(){
  const s=S(), T0=talkOf(s), names=[...new Set([ME.name,...[...PEERS.values()].map(p=>p.name),...Object.keys(T0)])];
  const rows=names.map(n=>{ const x=T0[n]||Object.fromEntries(LANGK.map(k=>[k,0])); return {n,x,tot:LANGK.reduce((a,k)=>a+(x[k]||0),0)}; });
  const max=Math.max(60000,...rows.map(r=>r.tot)); const spk=n=>n===ME.name?SPK:[...PEERS.entries()].some(([id,p])=>p.name===n&&PEERSPK.get(id));
  let h=`<h4><span>${esc(t("talkTitle"))}</span></h4>`+rows.map(r=>`<div class="trow"><span class="nm"><i class="${spk(r.n)?"sp":""}"></i>${esc(r.n)}</span><span class="tbar">${LANGK.map(k=>r.x[k]?`<b class="${k}" style="width:${r.x[k]/max*100}%"></b>`:"").join("")}</span><span class="v">${mmss(r.tot)}</span></div>`).join("");
  const learnerOf=l=>{ const r=rows.find(r=>(T0[r.n]||{}).learn===l||(r.n===ME.name&&ME.learn===l)); return r||null; };
  const sh=LANGS.map(l=>{ const tot=rows.reduce((a,r)=>a+(r.x[l]||0),0); if(tot<20000) return ""; const lr=learnerOf(l)||rows[0];
    return `<div class="share">${esc(t("shareIn",LNAME[l],lr.n,""))}<b>${Math.round((lr.x[l]||0)/tot*100)}%</b> · ${mmss(lr.x[l]||0)}</div>`; }).join("");
  h+=sh||`<div class="share">${esc(t("talkHint"))}</div>`;
  $("#talk").innerHTML=h;
}

function renderTrend(){
  const arr=Object.values(R.sessions).sort((a,b)=>a.created-b.created).slice(-12);
  const data=arr.map(s=>{ const x=(s.talk||{})[ME.name]||{}; const all=LANGK.reduce((a,k)=>a+(x[k]||0),0); return {s,mine:x[ME.learn]||0,other:all-(x[ME.learn]||0)}; });
  if(!data.some(d=>d.mine+d.other>0)){ $("#trend").innerHTML=""; return; }
  const max=Math.max(...data.map(d=>d.mine+d.other),60000);
  $("#trend").innerHTML=`<div class="small muted" style="margin-bottom:6px">${esc(t("trendTitle"))}</div><div class="trend">${data.map(d=>`<div class="r"><span>${esc(t("sessionN",d.s.n))}</span><span class="tbar"><b class="${ME.learn}" style="width:${d.mine/max*100}%"></b><b class="free" style="width:${d.other/max*100}%"></b></span><span class="v">${mmss(d.mine+d.other)}</span></div>`).join("")}</div>`;
}


/* ---------- whiteboard: strokes are normalised (0–1) so every screen shows the same drawing ---------- */
const BOARD_COL=["#1f2a2e","#b4492f","#2c6b64","#2f6fb3"];
let BTOOL="pen", BCOL=0, BLIVE=null, BDOWN=null, BERASE=false;
function strokeDraw(ctx,W,H,s){ const p=s.p; if(!p||p.length<2) return; ctx.strokeStyle=s.c; ctx.lineWidth=Math.max(1.5,s.w*W); ctx.beginPath(); ctx.moveTo(p[0]*W,p[1]*H); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i]*W,p[i+1]*H); ctx.stroke(); }
function drawBoard(){
  const cv=$("#bd"); if(!cv||!R||!R.cur||!R.sessions[R.cur.v]) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle="#fdfdfb"; ctx.fillRect(0,0,W,H);
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(const s of yOf(R.cur.v).board.toArray()) strokeDraw(ctx,W,H,s);
  if(BLIVE) strokeDraw(ctx,W,H,{c:BOARD_COL[BCOL],w:0.004,p:BLIVE});
}
function bpos(e){ const r=$("#bd").getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; }
function boardTx(fn){ const o=yOf(R.cur.v); o.doc.transact(()=>fn(o.board),"local"); }
function nearStroke(p,x,y,r){ for(let i=0;i<p.length;i+=2){ const dx=p[i]-x, dy=p[i+1]-y; if(dx*dx+dy*dy<r*r) return true; } return false; }
function eraseAt(x,y){ const arr=yOf(R.cur.v).board; for(let i=arr.length-1;i>=0;i--){ if(nearStroke(arr.get(i).p,x,y,0.02)){ boardTx(a=>a.delete(i,1)); return; } } }
const bd=$("#bd");
bd.addEventListener("pointerdown",e=>{ if(!R) return; e.preventDefault(); bd.setPointerCapture(e.pointerId); const [x,y]=bpos(e);
  if(BTOOL==="eraser"){ BERASE=true; eraseAt(x,y); drawBoard(); } else { BDOWN=[+x.toFixed(4),+y.toFixed(4)]; BLIVE=[...BDOWN]; drawBoard(); } });
bd.addEventListener("pointermove",e=>{ if(!R) return; const [x,y]=bpos(e);
  if(BERASE){ eraseAt(x,y); drawBoard(); }
  else if(BLIVE){ BLIVE.push(+x.toFixed(4),+y.toFixed(4)); if(BLIVE.length%4===0||BLIVE.length<=4) drawBoard(); } });
function endStroke(){
  if(BERASE){ BERASE=false; return; }
  if(!BLIVE) return; const p=BLIVE; BLIVE=null; BDOWN=null; if(p.length<2) return;
  const sid=R.cur.v; boardTx(a=>a.push([{id:uid(),c:BOARD_COL[BCOL],w:0.004,p,by:ME.name,t:now()}]));
  drawBoard();
}
bd.addEventListener("pointerup",endStroke); bd.addEventListener("pointercancel",endStroke);
$("#b-tools").addEventListener("click",e=>{ const b=e.target.closest("[data-bt]"); if(!b) return; BTOOL=b.dataset.bt; renderBoardTools(); });
$("#b-cols").innerHTML=BOARD_COL.map((c,i)=>`<button data-bc="${i}" style="background:${c}" aria-label="${c}"></button>`).join("");
$("#b-cols").addEventListener("click",e=>{ const b=e.target.closest("[data-bc]"); if(!b) return; BCOL=+b.dataset.bc; BTOOL="pen"; renderBoardTools(); });
$("#b-undo").addEventListener("click",()=>{ if(!R) return; const arr=yOf(R.cur.v).board; for(let i=arr.length-1;i>=0;i--){ if(arr.get(i).by===ME.name){ boardTx(a=>a.delete(i,1)); break; } } drawBoard(); });
$("#b-clear").addEventListener("click",()=>{ if(!R) return; const arr=yOf(R.cur.v).board; if(arr.length) boardTx(a=>a.delete(0,a.length)); drawBoard(); });
function renderBoardTools(){ $$("[data-bt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.bt===BTOOL)); $$("[data-bc]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.bc===BCOL&&BTOOL==="pen")); }
renderBoardTools();
window.addEventListener("resize",()=>{ if(TAB==="board") drawBoard(); });

/* ---------- sessions: new, history, export ---------- */
$("#b-new").addEventListener("click",()=>{ if(!confirm(t("confirmNew"))) return; const n=Math.max(...Object.values(R.sessions).map(x=>x.n||0))+1; const s=blankSession(n); s.plan=Object.assign({},S().plan,{t:now()});
  change("session",s); change("cur",{v:s.id,t:now()}); });
$("#b-hist").addEventListener("click",()=>{ const arr=Object.values(R.sessions).sort((a,b)=>b.created-a.created);
  $("#hist").innerHTML=arr.map(s=>`<li><button data-open="${s.id}" aria-current="${s.id===R.cur.v}"><span><b>${esc(t("sessionN",s.n))}</b> · ${esc(new Date(s.created).toLocaleDateString())}</span><span class="muted small">${esc(t("items",sorted(s.vocab).length,sorted(s.fix).length))}${(s.talk||{})[ME.name]?" · "+esc(mmss(["zh","pt","free"].reduce((a,k)=>a+((s.talk[ME.name][k])||0),0))):""}</span></button></li>`).join("");
  renderTrend(); $("#a-name").value=R.name.v||""; $("#a-turl").value=R.turn.url||""; $("#a-tuser").value=R.turn.user||""; $("#a-tpass").value=R.turn.pass||""; $("#m-hist").hidden=false; });
$("#hist").addEventListener("click",e=>{ const b=e.target.closest("[data-open]"); if(!b) return; change("cur",{v:b.dataset.open,t:now()}); $("#m-hist").hidden=true; });
$("#m-close").addEventListener("click",()=>$("#m-hist").hidden=true);
$("#m-hist").addEventListener("click",e=>{ if(e.target.id==="m-hist") $("#m-hist").hidden=true; });
$("#a-save").addEventListener("click",()=>{ const nm=$("#a-name").value.trim(); if(nm&&nm!==R.name.v) change("name",{v:nm,t:now()});
  change("turn",{url:$("#a-turl").value.trim(),user:$("#a-tuser").value.trim(),pass:$("#a-tpass").value,t:now()}); toast(t("savedAt")); });
function exportMd(){
  const s=S(), d=new Date(s.created).toISOString().slice(0,10), L=x=>x.l==="zh"?"中文":"PT";
  let md=`# ${R.name.v||"Ponte"} — ${t("sessionN",s.n)} · ${d}\n\n## ${t("vocab")}\n`+sorted(s.vocab).reverse().map(x=>`- [${L(x)}] **${x.w}**${x.m?" — "+x.m:""}`).join("\n");
  md+=`\n\n## ${t("fixes")}\n`+sorted(s.fix).reverse().map(x=>`- [${L(x)}] ${x.bad?"~~"+x.bad+"~~ → ":""}**${x.good}**${x.note?" ("+x.note+")":""}`).join("\n");
  md+=`\n\n## ${t("talkTitle")}\n`+Object.values(talkOf(s)).map(x=>`- ${x.name}: ${mmss(LANGK.reduce((a,k)=>a+(x[k]||0),0))} (${LANGK.filter(k=>x[k]).map(k=>(LNAME[k]||t("other"))+" "+mmss(x[k])).join(" · ")})`).join("\n");
  md+=`\n\n## ${t("notes")}\n${yOf(s.id).notes.toString()}\n\n## ${t("summary")}\n`+Object.values(s.sum).map(x=>`### ${x.name}\n${x.text}`).join("\n\n")+"\n";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"})); a.download=`ponte-${d}-${s.n}.md`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$("#b-export").addEventListener("click",e=>{ e.stopPropagation(); PrintKit.menu($("#b-export"),[{label:t("exportWord"),run:()=>exportPK("docx")},{label:t("exportPdf"),run:()=>exportPK("print")},{label:t("exportMd"),run:exportMd}]); });
window.addEventListener("hashchange",()=>{ if(roomFromHash()!==ROOM) location.reload(); });
window.addEventListener("pagehide",()=>{ try{ if(BUS) send("bye",{}); }catch(e){} });
if(LOCAL) window.__ponte={setAcc:ms=>change("timer",{sid:S().id,item:{run:false,at:0,acc:ms,t:now()}}),get board(){return R?yOf(R.cur.v).board.toArray():null;},get R(){return R;},get PC(){return PC;},get PEERS(){return PEERS;}};
boot();
})();
